<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TF1+ — Étude de cas</title>
<style>
/* ============================================================
   Écran : une slide à la fois, mise à l'échelle, notes optionnelles
   Impression : une slide par page, 1920×1080
   ============================================================ */
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: #06070d;
  font-family: 'Space Grotesk', -apple-system, sans-serif;
  overflow: hidden;
}

#stage { display: flex; height: 100vh; }
#deck {
  --scale: 1;
  flex: 1 1 auto;
  display: grid; place-items: center;
  position: relative;
  min-width: 0;
}

.slide {
  position: absolute;
  width: 1920px; height: 1080px;
  overflow: hidden;
  transform: scale(var(--scale));
  transform-origin: center center;
  display: none;
  box-shadow: 0 24px 80px rgba(0,0,0,.55);
}
.slide.on { display: block; }

.t { position: absolute; white-space: pre-wrap; }
.r { position: absolute; }

.mesh { position: absolute; inset: 0; overflow: hidden; background: #04050f; }
.halo { position: absolute; filter: blur(90px); }

/* ---------- barre + notes ---------- */
#side {
  flex: 0 0 0;
  width: 0;
  background: #0d1018;
  border-left: 1px solid #1c2130;
  color: #cfd6e6;
  overflow-y: auto;
  padding: 0;
  transition: none;
}
body.notes-on #side { flex: 0 0 38%; width: 38%; padding: 34px 32px 60px; }
body:not(.notes-on) #side { display: none; }

#side h2 {
  font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
  color: #6f7c96; margin: 0 0 18px; font-weight: 500;
  font-family: 'IBM Plex Mono', monospace;
}
#notes ul { margin: 0; padding: 0 0 0 18px; }
#notes li { margin: 0 0 16px; font-size: 15.5px; line-height: 1.55; }
#notes b { color: #fff; font-weight: 700; }
#notes i { color: #98a4bd; }
#notes .vide { color: #5c6880; font-style: italic; }

#bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: 20px;
  padding: 10px 18px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px; letter-spacing: .1em;
  color: #5c6880;
  background: linear-gradient(to top, rgba(6,7,13,.92), rgba(6,7,13,0));
  pointer-events: none;
}
#counter { color: #9aa6bf; }
kbd {
  font-family: inherit; border: 1px solid #2a3246; border-radius: 3px;
  padding: 1px 5px; color: #7a869e;
}

/* ---------- impression ---------- */
@page { size: 1920px 1080px; margin: 0; }
@media print {
  html, body { overflow: visible; height: auto; background: #fff; }
  #bar, #side { display: none !important; }
  #stage { display: block; height: auto; }
  #deck { display: block; }
  .slide {
    position: relative !important;
    display: block !important;
    transform: none !important;
    box-shadow: none !important;
    break-after: page; page-break-after: always;
  }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  /* le flou n'est pas rasterisé de façon fiable à l'impression : halos adoucis par le dégradé seul */
  .halo { filter: none; }
}
</style>
<!--FONTS-->
</head>
<body>
<div id="stage">
  <div id="deck"></div>
  <aside id="side">
    <h2>Notes d'orateur</h2>
    <div id="notes"></div>
  </aside>
</div>
<div id="bar">
  <span id="counter">1 / 18</span>
  <span><kbd>←</kbd> <kbd>→</kbd> naviguer</span>
  <span><kbd>N</kbd> notes</span>
  <span><kbd>F</kbd> plein écran</span>
</div>
<!--DATA-->
<!--RENDER-->
</body>
</html>
